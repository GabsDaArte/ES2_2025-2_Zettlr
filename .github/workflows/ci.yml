name: configurando o github actions...
 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ] 
  workflow_dispatch:

jobs: 
  build:
 
    runs-on: ${{ matrix.os }}
 
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x] 
      fail-fast: false

    steps: 
      - uses: actions/checkout@v4
 
      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'  
 
      - name: Instalar Dependências
        run: npm install
 
      - name: Executar Testes
        run: npm test
 
      - name: Empacotar Aplicação
        run: npm run package
 
      - uses: actions/upload-artifact@v4
       
        if: success() || failure() 
        with:
          name: zettlr-package-${{ matrix.os }}-${{ matrix.node-version }}
          path: out/ 
          retention-days: 5